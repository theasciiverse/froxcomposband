# Builds FroxComposband's terminal version for the Asciiverse catalog and
# as system packages.
#
# For av: one archive per target, named froxcomposband-<target>.tar.gz,
# plus a SHA256SUMS file, attached to a GitHub release (hub/catalog/
# SCHEMA.md, release.source = "github"). Each archive holds the start
# script, and in game/ the binary with its lib/ data folder (help pages
# generated by the build), with the readme and licence notice.
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux build, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v7.3.2-av.1: upstream's version, then our packaging release.
# Linux builds are fully static (Alpine); macOS builds run natively on a
# runner of each architecture against the system's ncurses. The help pages
# a first run of the game generates are made once by the x86_64 Linux build
# and handed to the macOS builds, as upstream's own release workflow does.
# No Windows build yet.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: froxcomposband
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file src/froxcomposband

      - name: Export generated help
        if: matrix.arch == 'amd64'
        run: bash -c 'source scripts/release/common.sh && copy_generated_help_export "$RUNNER_TEMP/help"'

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'amd64'
        with:
          name: help
          path: ${{ runner.temp }}/help

      - name: Package for av
        run: |
          sh asciiverse/stage.sh
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: help
          path: ${{ runner.temp }}/help

      - name: Build
        run: |
          HELP_FROM="$RUNNER_TEMP/help" sh asciiverse/build.sh
          file src/froxcomposband
          otool -L src/froxcomposband

      - name: Package
        run: |
          sh asciiverse/stage.sh
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-*-*"
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "FroxComposband $TAG (terminal)" \
                 --notes "FroxComposband ${TAG%%-av.*} by Gliktch, terminal version, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. See PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
